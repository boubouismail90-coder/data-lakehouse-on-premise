x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME}
  restart: unless-stopped

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin,viewer:viewer"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    SOURCE_DB_HOST: ${SOURCE_DB_HOST}
    SOURCE_DB_PORT: ${SOURCE_DB_PORT}
    SOURCE_DB_NAME: ${SOURCE_DB_NAME}
    SOURCE_DB_USER: ${SOURCE_DB_USER}
    SOURCE_DB_PASSWORD: ${SOURCE_DB_PASSWORD}

    RUSTFS_ENDPOINT_URL: http://rustfs:9000
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    RUSTFS_REGION: us-east-1

  volumes:
  - ./airflow/dags:/opt/airflow/dags
  - ./airflow/logs:/opt/airflow/logs
  - ./airflow/config:/opt/airflow/config
  - ./airflow/plugins:/opt/airflow/plugins
  - ./spark/jobs:/opt/spark/jobs

  user: "${AIRFLOW_UID}:0"

  networks:
    - lakehouse-network

  depends_on:
    postgres:
      condition: service_healthy


services:
  metabase:
    image: metabase/metabase:latest
    container_name: lakehouse-metabase
    hostname: metabase

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_db
      MB_DB_PORT: "5432"
      MB_DB_USER: lakehouse_admin
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Africa/Casablanca

    networks:
      - lakehouse-network

  spark:
    image: spark:3.5.1
    container_name: lakehouse-spark

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8081:8080"

    environment:
      RUSTFS_ENDPOINT_URL: ${RUSTFS_ENDPOINT_URL}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_REGION: ${RUSTFS_REGION}
      BI_DB_HOST: ${BI_DB_HOST}
      BI_DB_PORT: ${BI_DB_PORT}
      BI_DB_NAME: ${BI_DB_NAME}
      BI_DB_USER: ${BI_DB_USER}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}

    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data

    networks:
      - lakehouse-network

    restart: unless-stopped


  spark-worker:
    image: spark:3.5.1
    container_name: lakehouse-spark-worker

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark:7077

    depends_on:
      - spark

    ports:
      - "8082:8081"

    environment:
      RUSTFS_ENDPOINT_URL: ${RUSTFS_ENDPOINT_URL}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_REGION: ${RUSTFS_REGION}

      BI_DB_HOST: ${BI_DB_HOST}
      BI_DB_PORT: ${BI_DB_PORT}
      BI_DB_NAME: ${BI_DB_NAME}
      BI_DB_USER: ${BI_DB_USER}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}

    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./data:/opt/spark/data

    networks:
      - lakehouse-network

    restart: unless-stopped


  rustfs:
    image: ${RUSTFS_IMAGE}
    container_name: lakehouse-rustfs
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_OBS_LOGGER_LEVEL: info

    ports:
      - "${RUSTFS_API_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"

    volumes:
      - rustfs-data:/data

    networks:
      - lakehouse-network

    healthcheck:
      test:
        - CMD
        - sh
        - -ec
        - >
          curl -fsS http://127.0.0.1:9000/health &&
          curl -fsS http://127.0.0.1:9001/rustfs/console/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s


  postgres:
    image: postgres:16
    container_name: lakehouse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - lakehouse-network

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    restart: "no"

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true


  airflow-api-server:
    <<: *airflow-common
    container_name: lakehouse-airflow-api-server

    command: api-server

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/spark/data

    ports:
      - "8080:8080"

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/api/v2/monitor/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler

    command: scheduler

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data:/opt/spark/data
      - ./spark/jobs:/opt/spark/jobs


    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8974/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  airflow-dag-processor:
    <<: *airflow-common
    container_name: lakehouse-airflow-dag-processor

    command: dag-processor


volumes:

  postgres-data:
    name: lakehouse-postgres-data

  rustfs-data:
    name: lakehouse-rustfs-data


networks:

  lakehouse-network:
    name: lakehouse-network
    driver: bridge